kind = "web"
previewPath = "/"
title = "Weather History"
version = "1.0.0"
id = "artifacts/weather-history"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20814

[services.development]
run = "pnpm --filter @workspace/weather-history run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/weather-history", "run", "build" ]
publicDir = "artifacts/weather-history/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20814"
BASE_PATH = "/"
